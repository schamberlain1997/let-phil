<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Log</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="nav-bar">
            <div class="logo">Fitness<span>Tracker</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Search</a></li>
                <li><a href="workout-log.html" class="active">Log</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <div class="log-card">
            <h2>Add Workout</h2>
            <form class="log-form-grid" onsubmit="event.preventDefault();">
                <input type="text" id="exerciseInput" placeholder="Exercise">
                <input type="number" id="weightInput" placeholder="Weight">
                <input type="number" id="repsInput" placeholder="Reps">
                <input type="number" id="setsInput" placeholder="Sets">
                <button id="add-workout-btn" class="btn-primary">Add</button>
            </form>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Exercise</th>
                        <th>Weight</th>
                        <th>Reps</th>
                        <th>Sets</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    </tbody>
            </table>
        </div>

        <div style="margin-top: 20px; text-align: right;">
            <button id="clear-all-btn" class="btn-delete" style="padding: 10px 20px;">Clear All Logs</button>
        </div>

        <div class="log-card" style="margin-top: 40px;">
            <h2>Contact Us</h2>
            <form id="contact-form" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="contact-name" placeholder="Your Name" required>
                <input type="email" id="contact-email" placeholder="Your Email" required>
                <textarea id="contact-message" placeholder="How can we help you?" rows="4" style="padding: 12px; border-radius: 8px; background: #2a3447; border: 1px solid #3d4b63; color: white;"></textarea>
                <button type="submit" class="btn-primary" style="width: fit-content; padding: 10px 30px;">Send Message</button>
            </form>
        </div>
    </div>

    <script src="script_log.js"></script>
</body>
</html>
