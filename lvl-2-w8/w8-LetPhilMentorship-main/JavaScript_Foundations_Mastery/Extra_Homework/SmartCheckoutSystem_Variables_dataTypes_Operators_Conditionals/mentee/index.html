<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛒 Smart Checkout System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
     <div class="card">
          <h1 class="header">Smart Checkout</h1>
          <span class="badge">Secure</span>
          <label for="cartTotal">Cart Total</label>
          <input type="number" id="cartTotal" name="cartTotal" placeholder="180">
          <div class="row">
               <select id="membership">
                    <option>Select Membership</option>
                    <option value="standard">Standard</option>
                    <option value="premium">Premium</option>
                    <option value="vip">VIP</option>
               </select>
               <select id="coupon">
                    <option>Coupon?</option>
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
               </select>
          </div>
          <button id="calcBtn" class="btn">Calculate Total</button>
          <p id="message" class="message"></p>
          
     </div>
     <div class="card">
          <h1>Order Summary</h1>
          <span class="badge">Receipt</span>
          <div class="line">
               <span>Subtotal</span>
               <span id="subtotalText">$0.00</span>
          </div>
          <div class="line">
               <span>Discount</span>
               <span id="discountText">$0.00</span>
          </div>
          <div class="line">
               <span>Shipping</span>
               <span id="shippingText">$0.00</span>
          </div>
          <div class="line" class="total">
               <span>Final Total</span>
               <span id="finalTotalText">$0.00</span>
          </div>
          <p class="note">- Premium gets 15% off</p>
          <p class="note">- VIP gets 25% off</p>
          <p class="note">- Coupon adds extra 10% off</p>
          <p class="note">- Orders >= $150 ship free</p>
     </div>
     </div>
  </body>
  <script src="script.js"></script>
</html>
