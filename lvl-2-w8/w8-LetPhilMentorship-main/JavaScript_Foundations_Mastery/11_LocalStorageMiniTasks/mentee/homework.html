<!DOCTYPE html>
<html lang="en">
  <head>

      <section class="card">

        <h1>Favorite Quote Saver</h1>

    <!-- id: "quoteInput" -->
    <!-- class: "textarea" -->
    <!-- rows: 4 -->
          <div class="field">
            <label for="quoteInput"></label>
              <textarea
               id="quoteInput"
               class="textarea"
               rows="4">
               </textarea>
          </div>
 
    <!-- STEP 6 — Create the button row -->
    <!-- Add a <div> with class "button-row" -->
          
    <!-- STEP 7 — Add the save button -->
    <!-- Add a <button> -->

    <!-- Text: "Save Quote" -->

    <!-- Text: "Clear Quote" -->

          <div class="button-row">
            <button id="saveQuoteBtn" class="btn primary">Save Quote</button>
            <button id="clearQuoteBtn" class="btn ghost">Clear Quote</button>
         </div>

    <!-- STEP 9 — Create the saved quote display block -->
    <!-- Add a <div> with class "display-block" -->

    <!-- Text: "Saved Quote" -->

          </div>
